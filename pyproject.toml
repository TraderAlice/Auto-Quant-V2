[project]
name = "auto-quant"
version = "0.9.31"
description = "Agent-native workbench that turns quantitative research into versioned, testable engineering workflows."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "exchange-calendars==4.13.2",
]

[project.optional-dependencies]
columnar = ["pyarrow>=16"]

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
    "jsonschema>=4.23",
]

[project.scripts]
aq = "autoquant.cli:main"
aq-python = "autoquant.python_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoquant"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
package = true
