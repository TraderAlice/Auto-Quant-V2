[project]
name = "auto-quant"
version = "0.1.0"
description = "AI-native quantitative research workbench and autonomous code-optimization Harness."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "exchange-calendars==4.13.2",
]

[project.optional-dependencies]
columnar = ["pyarrow>=16"]

[dependency-groups]
dev = ["jsonschema>=4.23"]

[project.scripts]
aq = "autoquant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoquant"]

[tool.uv]
package = true
