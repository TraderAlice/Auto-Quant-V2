[project]
name = "auto-quant"
version = "0.1.0"
description = "AI-native quantitative research workbench and autonomous code-optimization Harness."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "freqtrade==2026.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[project.scripts]
aq = "autoquant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoquant"]

[tool.uv]
package = true
